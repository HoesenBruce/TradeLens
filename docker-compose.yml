# Official TradeLens GHCR images. Compose loads registry/tag overrides from .env.
# TM_IMAGE_REGISTRY defaults to ghcr.io/hoesenbruce; TM_IMAGE_TAG to latest.
# Pin a stable version in production (see .env.example).
# Source fallback: make up-build / make up-postgres-build.
# Never alternate upstream TraderMemos and TradeLens on an existing database.

services:
  api:
    labels:
      org.opencontainers.image.title: TradeLens API
    image: ${TM_IMAGE_REGISTRY:-ghcr.io/hoesenbruce}/tradelens-api:${TM_IMAGE_TAG:-latest}
    ports:
      - "8080:8080"
    environment:
      # Production: export TM_JWT_SECRET=$(openssl rand -hex 32) and omit ALLOW_INSECURE.
      TM_JWT_SECRET: ${TM_JWT_SECRET:-change-me}
      TM_ALLOW_INSECURE_JWT: ${TM_ALLOW_INSECURE_JWT:-true}
      TM_ALLOW_REGISTRATION: ${TM_ALLOW_REGISTRATION:-false}
      TM_DATABASE_URL: ${TM_DATABASE_URL:-sqlite:///data/tradermemos.db}
      TM_ATTACH_DIR: ${TM_ATTACH_DIR:-/data/attachments}
      TM_MARKET_DATA_ENABLED: ${TM_MARKET_DATA_ENABLED:-true}
      TM_MARKET_DATA_PROVIDER: ${TM_MARKET_DATA_PROVIDER:-yahoo}
      TM_MARKET_DATA_PROVIDERS: ${TM_MARKET_DATA_PROVIDERS:-}
      TM_MARKET_DATA_HTTP_BASE_URL: ${TM_MARKET_DATA_HTTP_BASE_URL:-}
      TM_MARKET_DATA_HTTP_API_KEY: ${TM_MARKET_DATA_HTTP_API_KEY:-}
      TM_MARKET_DATA_API_KEY: ${TM_MARKET_DATA_API_KEY:-}
      TM_OCR_ENABLED: ${TM_OCR_ENABLED:-false}
      TM_SHARE_LINKS_ENABLED: ${TM_SHARE_LINKS_ENABLED:-false}
      TM_OCR_VISION_BASE_URL: ${TM_OCR_VISION_BASE_URL:-https://api.openai.com/v1}
      TM_OCR_VISION_API_KEY: ${TM_OCR_VISION_API_KEY:-}
      TM_OCR_VISION_MODEL: ${TM_OCR_VISION_MODEL:-gpt-4o-mini}
      # Only needed when the SPA is on another origin (Vercel/CF Pages).
      # Same-origin Docker (web → /api proxy) should leave this empty.
      TM_CORS_ORIGINS: ${TM_CORS_ORIGINS:-}
    volumes:
      - tm_data:/data
    restart: unless-stopped
    healthcheck:
      # debian-slim has no curl/wget; bash /dev/tcp reaches /healthz instead.
      test:
        [
          "CMD",
          "bash",
          "-c",
          'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q "200 OK" <&3',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  web:
    labels:
      org.opencontainers.image.title: TradeLens Web
    image: ${TM_IMAGE_REGISTRY:-ghcr.io/hoesenbruce}/tradelens-web:${TM_IMAGE_TAG:-latest}
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  tm_data:
