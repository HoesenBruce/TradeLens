pid /tmp/demo-nginx.pid;
error_log stderr;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    client_body_temp_path /tmp/demo-client;
    proxy_temp_path /tmp/demo-proxy;
    fastcgi_temp_path /tmp/demo-fastcgi;
    uwsgi_temp_path /tmp/demo-uwsgi;
    scgi_temp_path /tmp/demo-scgi;
    server {
        listen 0.0.0.0:__PORT__;
        # Render terminates HTTPS and maps its public port to this private port.
        absolute_redirect off;
        root /app/web;
        index index.html;
        client_max_body_size 16k;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        location /api/ {
            proxy_pass http://127.0.0.1:18080;
            proxy_set_header Host $host;
            # Replace untrusted client forwarding headers.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 30s;
        }
        location = /healthz { proxy_pass http://127.0.0.1:18080/healthz; }
        location = /readyz { proxy_pass http://127.0.0.1:18081/readyz; }
        location = /demo { default_type text/html; alias /app/demo/index.html; }
        location = / { return 302 /demo; }
        location = /robots.txt { return 200 "User-agent: *\nDisallow: /\n"; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
