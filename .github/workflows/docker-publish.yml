# GHCR publication remains disabled until controlled first-release validation.
name: Publish TradeLens Docker images

on:
  workflow_call:
    inputs:
      source_sha:
        description: Source SHA returned by Release Please
        required: true
        type: string
      version:
        description: Semver version without v prefix (from release-please)
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Semver version without v prefix; empty = full-SHA tag only
        required: false
        type: string

permissions:
  contents: read

# Serialize releases so moving stable tags cannot race.
concurrency:
  group: tradelens-ghcr-publication
  cancel-in-progress: false

jobs:
  metadata:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.version != '' && inputs.source_sha != '') || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      tags: ${{ steps.meta.outputs.tags }}
      build_time: ${{ steps.meta.outputs.build_time }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: meta
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/docker-release-metadata.py

  # Same checks as PR CI — reused so a release can never publish images that
  # skipped tests.
  test-api:
    needs: metadata
    uses: ./.github/workflows/api-ci.yml
    with:
      concurrency_key: docker-publish
      source_ref: ${{ needs.metadata.outputs.commit }}

  test-web:
    needs: metadata
    uses: ./.github/workflows/web-ci.yml
    with:
      source_ref: ${{ needs.metadata.outputs.commit }}

  publish:
    name: Push ${{ matrix.image }}
    needs: [metadata, test-api, test-web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Required reviewers must be configured before enabling this workflow.
    environment: ghcr
    # QEMU arm64 builds can wedge; a hung job otherwise blocks the
    # release-please concurrency group indefinitely.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: api/Dockerfile
          - image: web
            dockerfile: web/Dockerfile

    steps:
      - uses: actions/checkout@v7
        with:
          # Run validation from this workflow revision, then checkout the release.
          ref: ${{ github.sha }}
          fetch-depth: 0

      # Recheck after environment approval: a newer stable release may now exist.
      - name: Revalidate release before publication
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.metadata.outputs.commit }}
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/docker-release-metadata.py

      - name: Refuse existing immutable image tags
        env:
          IMAGE: tradelens-${{ matrix.image }}
          VERSION: ${{ needs.metadata.outputs.version }}
          SOURCE_SHA: ${{ needs.metadata.outputs.commit }}
        run: python3 scripts/docker-release-metadata.py --check-registry

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.commit }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/hoesenbruce/tradelens-${{ matrix.image }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.title=TradeLens ${{ matrix.image }}
            org.opencontainers.image.source=https://github.com/HoesenBruce/TradeLens
            org.opencontainers.image.revision=${{ needs.metadata.outputs.commit }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
          tags: ${{ needs.metadata.outputs.tags }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            COMMIT=${{ needs.metadata.outputs.commit }}
            BUILD_TIME=${{ needs.metadata.outputs.build_time }}
            APP_VERSION=${{ needs.metadata.outputs.version }}
            APP_BUILD=${{ needs.metadata.outputs.commit }}

      - name: Preserve image digest
        env:
          IMAGE: ghcr.io/hoesenbruce/tradelens-${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ needs.metadata.outputs.commit }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          printf '%s@%s source=%s version=%s\n' "$IMAGE" "$DIGEST" "$SOURCE_SHA" "$VERSION" | tee image-digest.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: ghcr-digest-${{ matrix.image }}-${{ needs.metadata.outputs.commit }}
          path: image-digest.txt
          retention-days: 90
