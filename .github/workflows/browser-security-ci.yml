name: Browser security CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: browser-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-security:
    name: Chromium security E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache-dependency-path: api/go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Build production Web with the local synthetic API
        run: ./node_modules/.bin/vp build
        env:
          VITE_API: /api/v1
      - name: Production security regressions (disposable SQLite and local mocks)
        run: node scripts/run-security-e2e.mjs
