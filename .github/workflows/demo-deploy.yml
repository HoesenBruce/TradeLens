name: Deploy Render demo

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      source_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Existing latest stable version, without v (run workflow on main)
        required: true
        type: string
      publication_run_id:
        description: Release Please or Docker run with both successful publishing jobs and digest artifacts
        required: true
        type: string
      bootstrap_live_sha:
        description: First acceptance only — exact current non-release Live SHA approved for replacement
        required: false
        type: string

permissions:
  contents: read
  actions: read

# Includes approval wait, deployment and smoke. Never cancel an active deploy.
concurrency:
  group: tradelens-render-demo
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.DEMO_AUTO_DEPLOY_ENABLED == 'true')) }}
    runs-on: ubuntu-latest
    environment: render-demo
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate publication, deploy exact source and smoke test
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          PUBLICATION_RUN_ID: ${{ inputs.publication_run_id || github.run_id }}
          BOOTSTRAP_LIVE_SHA: ${{ inputs.bootstrap_live_sha }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: python3 scripts/demo-deploy.py
      - name: Preserve sanitized deployment evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: render-demo-${{ github.run_id }}-${{ github.run_attempt }}
          path: demo-deploy-record.json
          if-no-files-found: ignore
          retention-days: 90
