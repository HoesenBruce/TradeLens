# Vet, test, and build the Go API. Runs on every PR and push to main, and is
# reused by docker-publish.yml so release builds run the exact same checks.
# The "Test API" job is a required status check on main (repo ruleset).

name: API CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
    inputs:
      source_ref:
        description: Validated release source commit; empty uses event ref
        type: string
        default: ""
      concurrency_key:
        description: >-
          Distinguishes callers that reuse this workflow within one run.
          Two calls on the same ref land in the same concurrency group,
          and GitHub cancels one of them — silently skipping whatever
          job needed it. Callers must pass a unique value.
        required: false
        type: string
        default: ""

concurrency:
  group: api-ci-${{ github.ref }}-${{ inputs.concurrency_key }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-api:
    name: Test API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache-dependency-path: api/go.sum

      - name: Vet
        run: go vet ./...

      - name: Release and demo deployment regression tests (offline)
        working-directory: .
        run: |
          python3 -m unittest discover -s scripts -p 'test_*deploy*.py'
          python3 -m unittest discover -s scripts -p 'test_docker_release_metadata.py'

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...
