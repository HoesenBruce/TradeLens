# Contributor / source build override.
# Default docker-compose.yml pulls official TradeLens GHCR images — merge this file to build locally.
#
#   make up-build
#   # or:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build -d
#
# Optional Postgres:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml -f docker-compose.postgres.yml up --build -d

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        VERSION: ${TM_IMAGE_TAG:-dev}
        COMMIT: ${TM_COMMIT:-local}
    image: tradelens-api:local
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        APP_VERSION: ${TM_IMAGE_TAG:-dev}
        APP_BUILD: ${TM_COMMIT:-local}
    image: tradelens-web:local
